atoms:
  - name: static
    description: Corazon Engineer static service — watches the schema file tree, serves the read-only schema views (query / query-detail / stream) to the web frontend, and validates atoms / edges / contracts; writes go through the ai shell
    path: ./workspace/static
    runtime_type: go
    runtime_version: "1.22"
    role: service

    interfaces:
      provides:
        - id: static-query
          channel: network
          protocol: http
          contract: ./contracts/static-query.yaml
          extend:
            path: /static/query
            method: POST
        - id: static-query-detail
          channel: network
          protocol: http
          contract: ./contracts/static-query-detail.yaml
          extend:
            path: /static/query-detail
            method: POST
        - id: static-validate
          channel: network
          protocol: http
          contract: ./contracts/static-validate.yaml
          extend:
            path: /static/validate
            method: POST
        - id: static-stream
          channel: network
          protocol: http
          contract: ./contracts/static-stream.yaml
          extend:
            path: /static/stream
            method: POST

      consumes: []
