atoms:
  - name: static
    description: Corazon Engineer static service — watches the schema file tree and serves the read-only views (query / query-detail / stream) to the web frontend; it does not validate the tree — a malformed atom or a dangling edge is not its business; the views cover every file type — atoms, edges, contracts, how-to, development, docs, notes, and the dot-directory resources skills (.agents/skills) and blueprints (.agents/blueprints); writes go through the ai shell
    path: ./workspace/static
    runtime_type: go
    runtime_version: "1.22"
    role: service

    interfaces:
      provides:
        - id: static-query
          channel: network
          protocol: http
          contract: ./contracts/static-query.yaml
          extend:
            path: /static/query
            method: POST
        - id: static-query-detail
          channel: network
          protocol: http
          contract: ./contracts/static-query-detail.yaml
          extend:
            path: /static/query-detail
            method: POST
        - id: static-stream
          channel: network
          protocol: http
          contract: ./contracts/static-stream.yaml
          extend:
            path: /static/stream
            method: POST

      consumes: []
