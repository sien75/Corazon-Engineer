atoms:
  - name: log
    description: Corazon Engineer log service — owns the project's sqlite state — records (call / observe / conversation), tabs (each tab's pane tree, name and last activity), sessions (each conversation's kind, main or sub, and the tab it belongs to) and current (which tabs are open, and the main session); exposes log query/detail/search/mutation/stream APIs plus the tab, session and current ones
    path: ./workspace/log
    runtime_type: go
    runtime_version: "1.22"
    role: service

    interfaces:
      provides:
        - id: log-query
          channel: network
          protocol: http
          contract: ./contracts/log-query.yaml
          extend:
            path: /log/query
            method: POST
        - id: log-session-detail
          channel: network
          protocol: http
          contract: ./contracts/log-session-detail.yaml
          extend:
            path: /log/session-detail
            method: POST
        - id: log-delete
          channel: network
          protocol: http
          contract: ./contracts/log-delete.yaml
          extend:
            path: /log/delete
            method: POST
        - id: log-list
          channel: network
          protocol: http
          contract: ./contracts/log-list.yaml
          extend:
            path: /log/list
            method: POST
        - id: log-query-detail
          channel: network
          protocol: http
          contract: ./contracts/log-query-detail.yaml
          extend:
            path: /log/query-detail
            method: POST
        - id: log-search
          channel: network
          protocol: http
          contract: ./contracts/log-search.yaml
          extend:
            path: /log/search
            method: POST
        - id: log-mutation
          channel: network
          protocol: http
          contract: ./contracts/log-mutation.yaml
          extend:
            path: /log/mutation
            method: POST
        - id: log-stream
          channel: network
          protocol: http
          contract: ./contracts/log-stream.yaml
          extend:
            path: /log/stream
            method: POST
        - id: log-tab-new
          channel: network
          protocol: http
          contract: ./contracts/log-tab-new.yaml
          extend:
            path: /log/tab/new
            method: POST
        - id: log-tab-mutation
          channel: network
          protocol: http
          contract: ./contracts/log-tab-mutation.yaml
          extend:
            path: /log/tab/mutation
            method: POST
        - id: log-tab-detail
          channel: network
          protocol: http
          contract: ./contracts/log-tab-detail.yaml
          extend:
            path: /log/tab/detail
            method: POST
        - id: log-tab-list
          channel: network
          protocol: http
          contract: ./contracts/log-tab-list.yaml
          extend:
            path: /log/tab/list
            method: POST
        - id: log-tab-on
          channel: network
          protocol: http
          contract: ./contracts/log-tab-on.yaml
          extend:
