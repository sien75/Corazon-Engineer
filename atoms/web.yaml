atoms:
  - name: web
    description: Corazon Engineer web shell — one conversation (main) plus the tabs main opens (or the launcher opens, via the + button). every conversation — main and each tab — is the <engineer-chat> custom element under components/ (one implementation, shadow DOM, /components/chat.css); every page tab is an iframe onto an agent's own page. The workspace (which tabs are open, each tab's pane tree, which session is main) is read from log, and the shell resumes the conversations a tab shows before drawing it; main's workspace tools open, split, close and delete tabs, and their tool frames make the shell re-read the workspace. The launcher lists blueprints (static) and recent sessions (log). The file server (workspace/web/server) is multi-root — /config.js (an ES module whose ENGINEER export holds the static / ai / log addresses) and the app assets come from --assets, while /agent/<sessionId>/ serves a blueprint directory from --blueprints (the session is resolved to its slug through log, so one page is shared by every agent made from it; --agents, optional, holds the per-agent copies older sessions still have). It owns the page theme — /theme.css is the palette both the shell and blueprints link, and the shell writes the current data-theme into a page's document
    path: ./workspace/web
    runtime_type: browser
    role: service

    interfaces:
      provides: []
      consumes:
        - id: static-query
          channel: network
          protocol: http
          contract: ./contracts/static-query.yaml
          extend:
            path: /static/query
            method: POST
        - id: static-query-detail
          channel: network
          protocol: http
          contract: ./contracts/static-query-detail.yaml
          extend:
            path: /static/query-detail
            method: POST
        - id: ai-new
          channel: network
          protocol: http
          contract: ./contracts/ai-new.yaml
          extend:
            path: /ai/new
            method: POST
        - id: ai-ask
          channel: network
          protocol: http
          contract: ./contracts/ai-ask.yaml
          extend:
            path: /ai/ask
            method: POST
        - id: ai-stream
          channel: network
          protocol: http
          contract: ./contracts/ai-stream.yaml
          extend:
            path: /ai/stream
            method: POST
        - id: ai-stop
          channel: network
          protocol: http
          contract: ./contracts/ai-stop.yaml
          extend:
