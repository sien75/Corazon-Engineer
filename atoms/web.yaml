atoms:
  - name: web
    description: Corazon web frontend — renders the architecture graph from schema-query and shows atom/edge details
    path: ./workspace/web
    runtime_type: browser
    role: service

    interfaces:
      provides: []
      consumes:
        - id: schema-query
          channel: network
          protocol: http
          contract: ./contracts/schema-query.yaml
          extend:
            path: /schema/query
            method: POST
        - id: schema-query-detail
          channel: network
          protocol: http
          contract: ./contracts/schema-query-detail.yaml
          extend:
            path: /schema/query-detail
            method: POST
