atoms:
  - name: web
    description: Corazon Engineer web shell — one conversation (main) plus the open sessions main puts on screen (or the launcher does, via the + button). every session is one view — main and a blueprint agent whose page is an iframe onto its own /agent/<sessionId>/, and the shell draws them with the <engineer-chat> custom element under components/ (one implementation, shadow DOM, /components/chat.css) or that iframe. There is no tab record — a tab is one open session, so the workspace (which sessions are open, in display order, and which one is main) is read from log's current row, and the shell resumes each open session before drawing it; main's workspace tools open, close, create and delete sessions, and their tool frames make the shell re-read the workspace. The launcher lists blueprints (static) and recent sessions (log's session list). The file server (workspace/web/server) is multi-root — /config.js (an ES module whose ENGINEER export holds the static / ai / log addresses) and the app assets come from --assets, while /agent/<sessionId>/ serves a blueprint directory from --blueprints (the session is resolved to its slug through log, so one page is shared by every agent made from it; --agents, optional, holds the per-agent copies older sessions still have). It owns the page theme — /theme.css is the palette both the shell and blueprints link, and the shell writes the current data-theme into a page's document
    path: ./workspace/web
    runtime_type: browser
    role: service

    interfaces:
      provides: []
      consumes:
        - id: static-query
          channel: network
          protocol: http
          contract: ./contracts/static-query.yaml
          extend:
            path: /static/query
            method: POST
        - id: static-query-detail
          channel: network
          protocol: http
          contract: ./contracts/static-query-detail.yaml
          extend:
            path: /static/query-detail
            method: POST
        - id: ai-new
          channel: network
          protocol: http
          contract: ./contracts/ai-new.yaml
          extend:
            path: /ai/new
            method: POST
        - id: ai-ask
          channel: network
          protocol: http
          contract: ./contracts/ai-ask.yaml
          extend:
            path: /ai/ask
            method: POST
        - id: ai-stream
          channel: network
          protocol: http
          contract: ./contracts/ai-stream.yaml
          extend:
