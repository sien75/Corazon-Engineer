atoms:
  - name: web
    description: Corazon Engineer web frontend — renders the architecture graph (static-query), drives ai conversation, shows log records; its file server (workspace/web/server) is multi-root — /config.js and the app assets come from --assets, while /pages/<id>/ serves the blueprint files in --pages, and /pages/<id> (no slash) is an SPA route that renders that blueprint in an iframe; it also owns the page theme — /theme.css is the palette both the shell and blueprints link, and the shell writes the current data-theme into the page's document
    path: ./workspace/web
    runtime_type: browser
    role: service

    interfaces:
      provides: []
      consumes:
        - id: static-query
          channel: network
          protocol: http
          contract: ./contracts/static-query.yaml
          extend:
            path: /static/query
            method: POST
        - id: static-query-detail
          channel: network
          protocol: http
          contract: ./contracts/static-query-detail.yaml
          extend:
            path: /static/query-detail
            method: POST
        - id: static-stream
          channel: network
          protocol: http
          contract: ./contracts/static-stream.yaml
          extend:
            path: /static/stream
            method: POST
        - id: ai-new
          channel: network
          protocol: http
          contract: ./contracts/ai-new.yaml
          extend:
            path: /ai/new
            method: POST
        - id: ai-ask
          channel: network
          protocol: http
          contract: ./contracts/ai-ask.yaml
          extend:
            path: /ai/ask
            method: POST
        - id: ai-stream
          channel: network
          protocol: http
          contract: ./contracts/ai-stream.yaml
          extend:
            path: /ai/stream
            method: POST
        - id: ai-resume
          channel: network
          protocol: http
          contract: ./contracts/ai-resume.yaml
          extend:
            path: /ai/resume
            method: POST
        - id: ai-skill-run
          channel: network
          protocol: http
          contract: ./contracts/ai-skill-run.yaml
          extend:
            path: /ai/skill/run
            method: POST
        - id: log-list
          channel: network
          protocol: http
          contract: ./contracts/log-list.yaml
          extend:
            path: /log/list
            method: POST
        - id: log-delete
          channel: network
          protocol: http
          contract: ./contracts/log-delete.yaml
          extend:
            path: /log/delete
            method: POST
        - id: ai-delete
          channel: network
          protocol: http
          contract: ./contracts/ai-delete.yaml
          extend:
            path: /ai/delete
            method: POST
        - id: log-session-detail
          channel: network
          protocol: http
          contract: ./contracts/log-session-detail.yaml
          extend:
            path: /log/session-detail
            method: POST
        - id: log-query
          channel: network
          protocol: http
          contract: ./contracts/log-query.yaml
          extend:
            path: /log/query
            method: POST
        - id: log-stream
          channel: network
          protocol: http
          contract: ./contracts/log-stream.yaml
          extend:
            path: /log/stream
            method: POST
