atoms:
  - name: ai
    description: Corazon Engineer ai service — pi-SDK-driven conversation / orchestration (any pi-supported LLM provider; keys from pi's own config (env, ~/.pi/agent/auth.json, or --api-key)); exposes ai session APIs to the frontend, reads/writes schema and project files directly via the built-in shell (bash), writes/reads records via log, connects external systems via bash; it owns two roles of custom tools — every session gets ask_user (ask and end the turn); main, the one conversation the shell itself hosts, additionally gets the workspace tools (current-tab-list, current-tab-mutation, main-list, main-new, main-resume, tab-new, tab-delete, tab-layout-mutation) that read and write tabs and current through log, so main opens, closes, splits and deletes the tabs the shell shows; main-new starts a fresh main conversation and moves log's main-session pointer to it, so the shell switches to an empty chat while the previous conversation keeps its records; main-list lists those earlier main conversations and main-resume points the shell back at one, resuming it from its records; a sub agent, instantiated from a blueprint, has no workspace tools; ai-new takes a blueprint slug, checks its two required files (README.md + index.html, any css / js / images alongside them), records the session's kind and blueprint in log, and appends that README plus the path of the blueprint directory last in a sub agent's system prompt, so the agent knows what its UI is and where it lives from the first turn; nothing is copied — the web server serves the prototype directory itself, so one page is shared by every agent made from it, and an edit reaches all of them on reload; the role's spec is agents/main or agents/sub; skill discovery is gone — skills are plain files that agents read, nothing more
    path: ./workspace/ai
    runtime_type: bun
    runtime_version: "1.3"
    role: service

    interfaces:
      provides:
        - id: ai-new
          channel: network
          protocol: http
          contract: ./contracts/ai-new.yaml
          extend:
            path: /ai/new
            method: POST
        - id: ai-ask
          channel: network
          protocol: http
          contract: ./contracts/ai-ask.yaml
          extend:
            path: /ai/ask
            method: POST
        - id: ai-stream
          channel: network
          protocol: http
          contract: ./contracts/ai-stream.yaml
          extend:
            path: /ai/stream
            method: POST
        - id: ai-stop
          channel: network
          protocol: http
          contract: ./contracts/ai-stop.yaml
          extend:
            path: /ai/stop
            method: POST
        - id: ai-delete
          channel: network
          protocol: http
          contract: ./contracts/ai-delete.yaml
          extend:
            path: /ai/delete
            method: POST
        - id: ai-resume
          channel: network
          protocol: http
          contract: ./contracts/ai-resume.yaml
          extend:
            path: /ai/resume
            method: POST
        - id: ai-blobs
          channel: network
          protocol: http
          contract: ./contracts/ai-blobs.yaml
          extend:
            path: /blobs/{sha256}
            method: GET

      consumes:
        - id: log-mutation
          channel: network
          protocol: http
          contract: ./contracts/log-mutation.yaml
          extend:
            path: /log/mutation
            method: POST
