atoms:
  - name: ai
    description: Corazon Engineer ai service — pi-SDK-driven conversation / orchestration (any pi-supported LLM provider; keys from pi's own config (env, ~/.pi/agent/auth.json, or --api-key)); exposes ai session APIs to the frontend, reads/writes schema and project files directly via the built-in shell (bash), writes/reads records via log, connects external systems via bash; it owns two roles of custom tools — every session gets ask_user (ask and end the turn); main, the one conversation the shell itself hosts and the one that belongs to no project, additionally gets the workspace tools (project-list, session-list, session-open, session-close, main-list, main-new, main-resume, session-new, session-delete) that read and write sessions and current through log, so main puts a session on screen, takes it off, creates an agent and deletes one; a tab is not stored — it is one open session, so opening a session is opening its tab; main-new starts a fresh main conversation and moves log's main-session pointer to it, so the shell switches to an empty chat while the previous conversation keeps its records; main-list lists those earlier main conversations and main-resume points the shell back at one, resuming it from its records; a sub agent, instantiated from a blueprint inside one project, has no workspace tools; ai-new takes a projectId and a blueprint slug, resolves the project's folder through log (log-project-get) — that folder is the agent's cwd and the tree its page is read from — checks the prototype's two required files (README.md + index.html, any css / js / images alongside them), records the session's kind, blueprint and display name (the page's <title>) in log, and appends that README plus the path of the blueprint directory last in a sub agent's system prompt, so the agent knows what its UI is and where it lives from the first turn; nothing is copied — the web server serves the prototype directory itself, so one page is shared by every agent made from it, and an edit reaches all of them on reload; the role's spec is agents/main or agents/sub; skill discovery is gone — skills are plain files that agents read, nothing more; --home is this service's own data (uploaded images), not a project — the program runs anywhere and a conversation's project folder comes from its session row
    path: ./workspace/ai
    runtime_type: bun
    runtime_version: "1.3"
    role: service

    interfaces:
      provides:
        - id: ai-new
          channel: network
          protocol: http
          contract: ./contracts/ai-new.yaml
          extend:
            path: /ai/new
            method: POST
        - id: ai-ask
          channel: network
          protocol: http
          contract: ./contracts/ai-ask.yaml
          extend:
            path: /ai/ask
            method: POST
        - id: ai-stream
          channel: network
          protocol: http
          contract: ./contracts/ai-stream.yaml
          extend:
            path: /ai/stream
            method: POST
        - id: ai-stop
          channel: network
          protocol: http
          contract: ./contracts/ai-stop.yaml
          extend:
            path: /ai/stop
            method: POST
        - id: ai-delete
          channel: network
          protocol: http
          contract: ./contracts/ai-delete.yaml
          extend:
            path: /ai/delete
            method: POST
        - id: ai-resume
          channel: network
          protocol: http
          contract: ./contracts/ai-resume.yaml
          extend:
            path: /ai/resume
            method: POST
        - id: ai-blobs
          channel: network
          protocol: http
          contract: ./contracts/ai-blobs.yaml
          extend:
            path: /blobs/{sha256}
            method: GET

      consumes:
        - id: log-project-get
          channel: network
          protocol: http
          contract: ./contracts/log-project-get.yaml
          extend:
            path: /log/project/get
            method: POST
        - id: log-project-list
          channel: network
          protocol: http
          contract: ./contracts/log-project-list.yaml
          extend:
            path: /log/project/list
            method: POST
        - id: log-mutation
          channel: network
          protocol: http
          contract: ./contracts/log-mutation.yaml
          extend:
            path: /log/mutation
            method: POST
        - id: log-query
          channel: network
          protocol: http
          contract: ./contracts/log-query.yaml
          extend:
            path: /log/query
            method: POST
        - id: log-session-messages
          channel: network
          protocol: http
          contract: ./contracts/log-session-messages.yaml
          extend:
            path: /log/session/messages
            method: POST
        - id: log-session-on
          channel: network
          protocol: http
          contract: ./contracts/log-session-on.yaml
          extend:
            path: /log/session/on
            method: POST
        - id: log-session-off
          channel: network
          protocol: http
          contract: ./contracts/log-session-off.yaml
          extend:
            path: /log/session/off
            method: POST
        - id: log-list
          channel: network
          protocol: http
          contract: ./contracts/log-list.yaml
          extend:
            path: /log/list
            method: POST
        - id: log-delete
          channel: network
          protocol: http
          contract: ./contracts/log-delete.yaml
          extend:
            path: /log/delete
            method: POST
        - id: log-session-upsert
          channel: network
          protocol: http
          contract: ./contracts/log-session-upsert.yaml
          extend:
            path: /log/session/upsert
            method: POST
        - id: log-session-kind
          channel: network
          protocol: http
          contract: ./contracts/log-session-kind.yaml
          extend:
            path: /log/session/detail
            method: POST
        - id: log-current-get
          channel: network
