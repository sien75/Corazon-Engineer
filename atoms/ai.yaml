atoms:
  - name: ai
    description: Corazon Engineer ai service — pi-SDK-driven conversation / orchestration (any pi-supported LLM provider; keys from pi's own config (env, ~/.pi/agent/auth.json, or --api-key)); exposes ai session APIs to the frontend, reads/writes schema and project files directly via the built-in shell (bash), validates the schema via static, writes/reads records via log, connects external systems via bash; it also owns automatic skill discovery — a skill is one piece of text, kept as a file at .agents/skills/<slug>/SKILL.md with candidates at .engineer/suggested-skills/<slug>.md, discovered from past conversation runs read back through log, and running one opens a session with that text; blueprints are frontend resources under .agents/blueprints/, written by the agent as plain files and served/listed by static — ai has no blueprint interface of its own
    path: ./workspace/ai
    runtime_type: bun
    runtime_version: "1.3"
    role: service

    interfaces:
      provides:
        - id: ai-new
          channel: network
          protocol: http
          contract: ./contracts/ai-new.yaml
          extend:
            path: /ai/new
            method: POST
        - id: ai-ask
          channel: network
          protocol: http
          contract: ./contracts/ai-ask.yaml
          extend:
            path: /ai/ask
            method: POST
        - id: ai-stream
          channel: network
          protocol: http
          contract: ./contracts/ai-stream.yaml
          extend:
            path: /ai/stream
            method: POST
        - id: ai-delete
          channel: network
          protocol: http
          contract: ./contracts/ai-delete.yaml
          extend:
            path: /ai/delete
            method: POST
        - id: ai-resume
          channel: network
          protocol: http
          contract: ./contracts/ai-resume.yaml
          extend:
            path: /ai/resume
            method: POST
        - id: ai-skill-run
          channel: network
          protocol: http
          contract: ./contracts/ai-skill-run.yaml
          extend:
            path: /ai/skill/run
            method: POST

      consumes:
        - id: static-validate
          channel: network
          protocol: http
          contract: ./contracts/static-validate.yaml
          extend:
            path: /static/validate
            method: POST
        - id: log-mutation
          channel: network
          protocol: http
          contract: ./contracts/log-mutation.yaml
          extend:
            path: /log/mutation
            method: POST
        - id: log-query
          channel: network
          protocol: http
          contract: ./contracts/log-query.yaml
          extend:
            path: /log/query
            method: POST
        - id: log-session-detail
          channel: network
          protocol: http
          contract: ./contracts/log-session-detail.yaml
          extend:
            path: /log/session-detail
            method: POST
