atoms:
  - name: ai
    description: Corazon Engineer ai service — pi-SDK-driven conversation / orchestration (which model a session runs is decided in three layers, per slot — the session's own row in log (what the `model` tool switched it to, or what it was created with), then the engineer home's models.yaml (main and sub, each with a `chat` and an `image` slot), then pi's own default for chat only (the provider/model pi's settings name when pi can serve it, else the first model it can serve; the image slot stops at models.yaml, since nothing consumes it yet); pi stays the source of the catalog, models.json and the credentials (auth.json / env), and a session never writes back to pi's settings; a model choice lives on the session row alone — nothing goes into the conversation's records — and the thinking level is not stored anywhere per session, pi derives it per model from its own settings); exposes ai session APIs to the frontend, reads/writes schema and project files directly via the built-in shell (bash), writes/reads records via log, connects external systems via bash; it owns two roles of custom tools — every session gets ask_user (ask and end the turn), model (list the chat models pi can use right now and switch this session's chat or image model by slot — a chat switch is a pi setModel on the live session, which overrides the configured `chat` default for that session only; an image switch only records the choice, since no image runtime is wired yet; either switch is written to the session row in log, which is what a resumed or restarted session is rebuilt from), usage (read-only report of this conversation's context usage and cost, from pi's own getContextUsage / getSessionStats) and compact (manual compaction — it is scheduled on the session's turn tail rather than called inline, because pi's compact() aborts and waits for idle and would otherwise wait on the very turn that asked for it; pi's compaction_end event then persists the summary like any other entry) and web_search (live web search behind one pluggable provider — DeepSeek's /v1/tools/search first, chosen by the `provider` argument, default deepseek; the key is the one pi already holds for that provider in auth.json or that provider's own env var and never passes through the model, so a search with no key fails and says why instead of returning nothing; results are a markdown list of title, URL, site, date, authority and abstract, and the tool is the same for main and sub); main, the one conversation the shell itself hosts and the one that belongs to no project, additionally gets the workspace tools (project-list, session-list, session-open, session-close, main-list, main-new, main-resume, session-new, session-delete) that read and write sessions and current through log, so main puts a session on screen, takes it off, creates an agent and deletes one; a tab is not stored — it is one open session, so opening a session is opening its tab; main-new starts a fresh main conversation and moves log's main-session pointer to it, so the shell switches to an empty chat while the previous conversation keeps its records; main-list lists those earlier main conversations and main-resume points the shell back at one, resuming it from its records; a sub agent, instantiated from a blueprint inside one project, has no workspace tools; ai-new takes a projectId and a blueprint slug, resolves the project's folder through log (log-project-get) — that folder is the agent's cwd and the tree its page is read from — checks the prototype's two required files (README.md + index.html, any css / js / images alongside them), records the session's kind, blueprint, display name (the page's <title>) and, when the caller names them, its chat and image models in log; on the first user turn of a blueprint agent it summarizes that session (user prompts plus assistant prose only — tool traffic and thinking are left out) with the session's own model and writes the result back as the display name, so a tab ends up named after what the conversation is about rather than after the page, and appends that README plus the path of the blueprint directory last in a sub agent's system prompt, so the agent knows what its UI is and where it lives from the first turn; nothing is copied — the web server serves the prototype directory itself, so one page is shared by every agent made from it, and an edit reaches all of them on reload; the role's spec is agents/main or agents/sub; skill discovery is gone — skills are plain files that agents read, nothing more; --home is this service's own data (uploaded images), not a project — the program runs anywhere and a conversation's project folder comes from its session row
    path: ./workspace/ai
    runtime_type: bun
    runtime_version: "1.3"
    role: service

    interfaces:
      provides:
        - id: ai-new
          channel: network
          protocol: http
          contract: ./contracts/ai-new.yaml
          extend:
            path: /ai/new
            method: POST
        - id: ai-ask
          channel: network
          protocol: http
          contract: ./contracts/ai-ask.yaml
          extend:
            path: /ai/ask
            method: POST
        - id: ai-stream
          channel: network
          protocol: http
          contract: ./contracts/ai-stream.yaml
          extend:
            path: /ai/stream
            method: POST
        - id: ai-stop
          channel: network
          protocol: http
          contract: ./contracts/ai-stop.yaml
          extend:
            path: /ai/stop
            method: POST
        - id: ai-delete
          channel: network
          protocol: http
          contract: ./contracts/ai-delete.yaml
          extend:
            path: /ai/delete
            method: POST
        - id: ai-resume
          channel: network
          protocol: http
          contract: ./contracts/ai-resume.yaml
          extend:
            path: /ai/resume
            method: POST
        - id: ai-blobs
          channel: network
          protocol: http
          contract: ./contracts/ai-blobs.yaml
          extend:
            path: /blobs/{sha256}
            method: GET

      consumes:
        - id: log-project-get
          channel: network
          protocol: http
          contract: ./contracts/log-project-get.yaml
          extend:
            path: /log/project/get
            method: POST
        - id: log-project-list
          channel: network
          protocol: http
          contract: ./contracts/log-project-list.yaml
          extend:
            path: /log/project/list
            method: POST
        - id: log-mutation
          channel: network
          protocol: http
          contract: ./contracts/log-mutation.yaml
          extend:
            path: /log/mutation
            method: POST
        - id: log-query
          channel: network
          protocol: http
          contract: ./contracts/log-query.yaml
          extend:
            path: /log/query
            method: POST
        - id: log-session-messages
          channel: network
          protocol: http
          contract: ./contracts/log-session-messages.yaml
          extend:
            path: /log/session/messages
            method: POST
        - id: log-session-on
          channel: network
          protocol: http
          contract: ./contracts/log-session-on.yaml
          extend:
            path: /log/session/on
            method: POST
        - id: log-session-off
          channel: network
          protocol: http
          contract: ./contracts/log-session-off.yaml
          extend:
            path: /log/session/off
            method: POST
        - id: log-list
          channel: network
          protocol: http
          contract: ./contracts/log-list.yaml
          extend:
            path: /log/list
            method: POST
        - id: log-delete
          channel: network
          protocol: http
          contract: ./contracts/log-delete.yaml
          extend:
            path: /log/delete
            method: POST
        - id: log-session-upsert
          channel: network
          protocol: http
          contract: ./contracts/log-session-upsert.yaml
          extend:
            path: /log/session/upsert
            method: POST
        - id: log-session-kind
          channel: network
          protocol: http
          contract: ./contracts/log-session-kind.yaml
          extend:
            path: /log/session/detail
            method: POST
        - id: log-current-get
          channel: network
