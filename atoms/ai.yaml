atoms:
  - name: ai
    description: Corazon Engineer ai service — pi-SDK-driven conversation / orchestration (any pi-supported LLM provider; keys from pi's own config (env, ~/.pi/agent/auth.json, or --api-key)); exposes ai session APIs to the frontend, reads/writes schema and project files directly via the built-in shell (bash), writes/reads records via log, connects external systems via bash; it owns two custom tools — ask_user (ask and end the turn) and layout, which reads and replaces the pane layout of the tab the session is shown in (a tree of agent panes stored per tabId via log, so the model can split the screen instead of only talking about it); it is also where an agent is born — ai-new takes a blueprint slug, copies the prototype's two files (.agents/blueprints/<slug>/{README.md,index.html}) into .engineer/agents/<sessionId>/, and appends that README last in the session's system prompt, so an agent carries its own copy of its UI and knows what it is from the first turn; skill discovery (the suggested-skills scan) is gone — skills are plain files that agents read, nothing more
    path: ./workspace/ai
    runtime_type: bun
    runtime_version: "1.3"
    role: service

    interfaces:
      provides:
        - id: ai-new
          channel: network
          protocol: http
          contract: ./contracts/ai-new.yaml
          extend:
            path: /ai/new
            method: POST
        - id: ai-ask
          channel: network
          protocol: http
          contract: ./contracts/ai-ask.yaml
          extend:
            path: /ai/ask
            method: POST
        - id: ai-stream
          channel: network
          protocol: http
          contract: ./contracts/ai-stream.yaml
          extend:
            path: /ai/stream
            method: POST
        - id: ai-stop
          channel: network
          protocol: http
          contract: ./contracts/ai-stop.yaml
          extend:
            path: /ai/stop
            method: POST
        - id: ai-delete
          channel: network
          protocol: http
          contract: ./contracts/ai-delete.yaml
          extend:
            path: /ai/delete
            method: POST
        - id: ai-resume
          channel: network
          protocol: http
          contract: ./contracts/ai-resume.yaml
          extend:
            path: /ai/resume
            method: POST
        - id: ai-blobs
          channel: network
          protocol: http
          contract: ./contracts/ai-blobs.yaml
          extend:
            path: /blobs/{sha256}
            method: GET

      consumes:
        - id: log-mutation
          channel: network
          protocol: http
          contract: ./contracts/log-mutation.yaml
          extend:
            path: /log/mutation
            method: POST
        - id: log-query
          channel: network
          protocol: http
          contract: ./contracts/log-query.yaml
          extend:
            path: /log/query
            method: POST
        - id: log-session-detail
          channel: network
          protocol: http
          contract: ./contracts/log-session-detail.yaml
          extend:
            path: /log/session-detail
            method: POST
        - id: log-tab-detail
          channel: network
          protocol: http
          contract: ./contracts/log-tab-detail.yaml
          extend:
            path: /log/tab/detail
            method: POST
        - id: log-tab-mutation
          channel: network
          protocol: http
          contract: ./contracts/log-tab-mutation.yaml
          extend:
            path: /log/tab/mutation
            method: POST
