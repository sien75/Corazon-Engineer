edges:
  - id: ai-to-log-write
    from: ai
    from_interface: log-mutation
    to: log
    to_interface: log-mutation
    channel: network
    protocol: http
    description: ai writes records (call / observe / conversation) into log after an operation
  - id: ai-to-log-read
    from: ai
    from_interface: log-query
    to: log
    to_interface: log-query
    channel: network
    protocol: http
    description: ai queries log records to review history / context
  - id: ai-to-log-session-messages
    from: ai
    from_interface: log-session-messages
    to: log
    to_interface: log-session-messages
    channel: network
    protocol: http
    description: ai reads a session's conversation messages to rebuild context on resume
  - id: ai-to-log-session-on
    from: ai
    from_interface: log-session-on
    to: log
    to_interface: log-session-on
    channel: network
    protocol: http
    description: session-open (main's tool) puts a session back on screen
  - id: ai-to-log-session-off
    from: ai
    from_interface: log-session-off
    to: log
    to_interface: log-session-off
    channel: network
    protocol: http
    description: session-close (main's tool) takes a session off screen, keeping its records
  - id: ai-to-log-list
    from: ai
    from_interface: log-list
    to: log
    to_interface: log-list
    channel: network
    protocol: http
    description: session-list / main-list (main's tools) read the project's sessions
  - id: ai-to-log-delete
    from: ai
    from_interface: log-delete
    to: log
    to_interface: log-delete
    channel: network
    protocol: http
    description: session-delete (main's tool) removes a conversation's records and its session row
  - id: ai-to-log-session-upsert
    from: ai
    from_interface: log-session-upsert
    to: log
    to_interface: log-session-upsert
    channel: network
    protocol: http
    description: ai records a new conversation's kind, blueprint and display name
  - id: ai-to-log-session-kind
    from: ai
    from_interface: log-session-kind
    to: log
    to_interface: log-session-kind
    channel: network
    protocol: http
    description: resume / session-new read a conversation's kind and blueprint to pick the role spec and the page
  - id: ai-to-log-current-get
    from: ai
    from_interface: log-current-get
    to: log
    to_interface: log-current-get
    channel: network
    protocol: http
    description: session-list / main-new / main-resume (main's tools) read which sessions are open and which is main
  - id: ai-to-log-current-put
    from: ai
    from_interface: log-current-put
    to: log
    to_interface: log-current-put
    channel: network
    protocol: http
    description: main-new / main-resume (main's tools) move log's main-session pointer, writing the open list back untouched
