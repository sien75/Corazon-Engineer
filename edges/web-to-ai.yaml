edges:
  - id: web-to-ai
    from: web
    from_interface: ai-new
    to: ai
    to_interface: ai-new
    channel: network
    protocol: http
    description: Web frontend creates an ai conversation session
  - id: web-to-ai-ask
    from: web
    from_interface: ai-ask
    to: ai
    to_interface: ai-ask
    channel: network
    protocol: http
    description: Web frontend sends a prompt to ai; ai orchestrates the operation (reply streams back)
  - id: web-to-ai-stream
    from: web
    from_interface: ai-stream
    to: ai
    to_interface: ai-stream
    channel: network
    protocol: http
    description: Web frontend consumes the session's SSE event stream; a run ends when ai closes it on agent_settled
  - id: web-to-ai-resume
    from: web
    from_interface: ai-resume
    to: ai
    to_interface: ai-resume
    channel: network
    protocol: http
    description: Web frontend resumes a history session; ai rebuilds its text context from log
  - id: web-to-ai-stop
    from: web
    from_interface: ai-stop
    to: ai
    to_interface: ai-stop
    channel: network
    protocol: http
    description: Web frontend aborts the run in flight; the session stays and can be asked again
  - id: web-to-ai-delete
    from: web
    from_interface: ai-delete
    to: ai
    to_interface: ai-delete
    channel: network
    protocol: http
    description: Web frontend deletes a session, releasing the live in-memory agent
  - id: web-to-ai-blobs
    from: web
    from_interface: ai-blobs
    to: ai
    to_interface: ai-blobs
    channel: network
    protocol: http
    description: Web frontend loads an image by its content address; ai serves the stored bytes
