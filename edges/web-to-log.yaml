edges:
  - id: web-to-log-list
    from: web
    from_interface: log-list
    to: log
    to_interface: log-list
    channel: network
    protocol: http
    description: the launcher lists recent conversations
  - id: web-to-log-tab-new
    from: web
    from_interface: log-tab-new
    to: log
    to_interface: log-tab-new
    channel: network
    protocol: http
    description: the launcher's pick creates the tab record for the agent it opens
  - id: web-to-log-tab-mutation
    from: web
    from_interface: log-tab-mutation
    to: log
    to_interface: log-tab-mutation
    channel: network
    protocol: http
    description: the launcher writes the new tab's single-pane layout
  - id: web-to-log-tab-detail
    from: web
    from_interface: log-tab-detail
    to: log
    to_interface: log-tab-detail
    channel: network
    protocol: http
    description: the shell reads a tab's pane tree when it restores the workspace
  - id: web-to-log-tab-off
    from: web
    from_interface: log-tab-off
    to: log
    to_interface: log-tab-off
    channel: network
    protocol: http
    description: the shell closes a tab the user clicked away (the record is kept)
  - id: web-to-log-current-get
    from: web
    from_interface: log-current-get
    to: log
    to_interface: log-current-get
    channel: network
    protocol: http
    description: the shell reads which tabs are open and the main session on load
  - id: web-to-log-current-put
    from: web
    from_interface: log-current-put
    to: log
    to_interface: log-current-put
    channel: network
    protocol: http
    description: the shell repairs the open list (drops tab ids whose record is gone) and records a new main session
  - id: web-to-log-session-kind
    from: web
    from_interface: log-session-kind
    to: log
    to_interface: log-session-kind
    channel: network
    protocol: http
    description: the shell checks that the main session still exists before starting main on it
  - id: web-to-log-session-detail
    from: web
    from_interface: log-session-detail
    to: log
    to_interface: log-session-detail
    channel: network
    protocol: http
    description: the shell replays main's conversation into its chat pane on load
