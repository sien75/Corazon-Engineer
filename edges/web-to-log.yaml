edges:
  - id: web-to-log-list
    from: web
    from_interface: log-list
    to: log
    to_interface: log-list
    channel: network
    protocol: http
    description: the launcher lists recent sessions (title, blueprint, last activity)
  - id: web-to-log-session-on
    from: web
    from_interface: log-session-on
    to: log
    to_interface: log-session-on
    channel: network
    protocol: http
    description: the launcher's pick puts the new — or an earlier — session on screen as a tab
  - id: web-to-log-session-off
    from: web
    from_interface: log-session-off
    to: log
    to_interface: log-session-off
    channel: network
    protocol: http
    description: the shell closes a tab the user clicked away (the session keeps its records)
  - id: web-to-log-current-get
    from: web
    from_interface: log-current-get
    to: log
    to_interface: log-current-get
    channel: network
    protocol: http
    description: the shell reads which sessions are open and the main session on load
  - id: web-to-log-current-put
    from: web
    from_interface: log-current-put
    to: log
    to_interface: log-current-put
    channel: network
    protocol: http
    description: the shell repairs the open list (drops session ids that no longer exist) and records a new main session
  - id: web-to-log-session-kind
    from: web
    from_interface: log-session-kind
    to: log
    to_interface: log-session-kind
    channel: network
    protocol: http
    description: the shell checks that the main session still exists before starting main on it
  - id: web-to-log-session-messages
    from: web
    from_interface: log-session-messages
    to: log
    to_interface: log-session-messages
    channel: network
    protocol: http
    description: the shell replays a conversation into its chat view on load
