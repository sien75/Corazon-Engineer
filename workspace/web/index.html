<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corazon Engineer</title>
  <script>
    (function () {
      var t = "light";
      try {
        var stored = localStorage.getItem("engineer.theme");
        if (stored === "dark" || stored === "solarized" || stored === "light") t = stored;
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="/vendor/highlight.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- The shell is one thing: main's own conversation, and the tabs main opens.
       Both live in #tabs; both are drawn into #panes. There are no fixed views. -->
  <header id="topbar">
    <span id="logo">Corazon Engineer</span>
    <nav id="tabs"></nav>
    <button id="tab-add" type="button" title="new tab" aria-label="new tab"><span class="tab-label">+</span></button>
    <div id="theme-wrap">
      <button id="theme-toggle" type="button" title="theme">theme</button>
      <div id="theme-menu" hidden>
        <button type="button" data-theme="light">light</button>
        <button type="button" data-theme="dark">dark</button>
        <button type="button" data-theme="solarized">solarized</button>
      </div>
    </div>
  </header>
  <main id="main">
    <div id="panes"></div>
    <div id="launcher" hidden></div>
    <div id="toast" hidden></div>
  </main>
  <script>
    // A boot failure has nowhere else to go: show it instead of a blank page.
    function bootError(message) {
      var panes = document.getElementById("panes");
      if (panes) panes.innerHTML = '<div class="empty-hint">engineer web: ' + message + "</div>";
    }
    window.addEventListener("error", function (e) { bootError(e.message || String(e)); });
    window.addEventListener("unhandledrejection", function (e) {
      bootError((e.reason && e.reason.message) || String(e.reason));
    });
  </script>
  <script type="module" src="/components/chat.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
