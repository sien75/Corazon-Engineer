<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corazon</title>
  <link rel="stylesheet" href="/vendor/highlight.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="topbar">
    <span id="logo">Corazon</span>
    <nav id="menu">
      <button type="button" data-view="graph" class="active">graph</button>
      <button type="button" data-view="runtime">runtime</button>
      <button type="button" data-view="devtime">devtime</button>
      <button type="button" data-view="contracts">contracts</button>
      <button type="button" data-view="docs">docs</button>
      <button type="button" data-view="notes">notes</button>
    </nav>
    <button id="ai-toggle" type="button">ai</button>
  </header>
  <main id="main">
    <div id="left">
      <div id="graph"></div>
      <div id="content" hidden></div>
      <aside id="panel" hidden>
        <button id="panel-close" type="button">×</button>
        <h2 id="panel-title"></h2>
        <div id="panel-body"></div>
      </aside>
    </div>
    <aside id="ai" hidden>
      <div id="ai-head">ai</div>
      <div id="ai-messages"></div>
      <div id="ai-input">
        <div id="ai-cmd" tabindex="-1" hidden></div>
        <textarea id="ai-input-field" rows="2" placeholder="ask… (Enter send, Shift+Enter newline)" autocomplete="off"></textarea>
        <button id="ai-stop" type="button" hidden>stop</button>
        <button id="ai-send" type="button">send</button>
      </div>
    </aside>
  </main>
  <script src="/config.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
