id: static-query-detail
description: Fetch content of a single leaf file

request:
  body:
    type: runtime | devtime | contract | docs | notes  # leaf file type
    id: string  # relative path (directory entry from static-query), e.g. "contracts/ai-ask.yaml"

response:
  status: 200
  body:
    type: runtime | devtime | contract | docs | notes  # echoed request type
    id: string  # echoed request id

    runtime?: string  # when type=runtime, raw file text (prose markdown / config yaml)

    devtime?: string  # when type=devtime, raw markdown text

    contract?:  # when type=contract, parsed contract file
      id: string
      description: string
      request: object
      response: object
      error: object

    docs?: string  # when type=docs, raw markdown text

    notes?: string  # when type=notes, raw markdown text

errors:
  - status: 400
    code: bad_request
    description: invalid type or id
  - status: 404
    code: not_found
    description: file not found
  - status: 500
    code: internal
    description: server error
