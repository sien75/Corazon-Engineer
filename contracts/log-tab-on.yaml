id: log-tab-on
description: Put existing tabs back in the open list (idempotent) — reopening a tab keeps its record and does not create a new one

request:
  body:
    tabIds: [string]  # tabs to open; already-open ids are left where they are
    index?: number  # where the first newly opened tab goes in the open list; omitted appends

response:
  status: 200
  body:
    openTabs: [string]  # the whole open list after the write, in display order

errors:
  - status: 400
    code: bad_request
    description: tabIds missing, or one of them does not exist
  - status: 500
    code: internal
    description: server internal error
