id: log-session-kind
description: Read one conversation's role, the blueprint it was made from and its display name (served at POST /log/session/detail); a session with no row is not an error to the caller, but this endpoint answers 404

request:
  body:
    sessionId: string  # conversation session id

response:
  status: 200
  body:
    sessionId: string
    kind: main | sub
    blueprint: string  # slug of the page this session drives, "" when it has none; the web server resolves /agent/<sessionId>/ through this
    title: string  # display name, "" when none was ever written
    createdAt: string

errors:
  - status: 400
    code: bad_request
    description: sessionId missing
  - status: 404
    code: not_found
    description: session does not exist
  - status: 500
    code: internal
    description: server internal error
