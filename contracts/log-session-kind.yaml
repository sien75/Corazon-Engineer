id: log-session-kind
description: Read one conversation's role, the project it belongs to, the blueprint it was made from and its display name (served at POST /log/session/detail); a session with no row is not an error to the caller, but this endpoint answers 404

request:
  body:
    sessionId: string  # conversation session id

response:
  status: 200
  body:
    sessionId: string
    kind: main | sub
    projectId: string  # the project this session belongs to, "" for main; static / ai / web resolve the folder through it
    blueprint: string  # slug of the page this session drives, "" when it has none; the web server resolves /agent/<sessionId>/ through this
    title: string  # display name, "" when none was ever written
    model: string  # provider/model-id chosen for this session, "" when pi's settings decide
    createdAt: string

errors:
  - status: 400
    code: bad_request
    description: sessionId missing
  - status: 404
    code: not_found
    description: session does not exist
  - status: 500
    code: internal
    description: server internal error
