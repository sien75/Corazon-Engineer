id: ai-delete
description: Delete a session and its stream

request:
  body:
    id: string  # session id

response:
  status: 200
  body:
    sessionId: string

errors:
  - status: 400
    code: bad_request
    description: bad request
  - status: 404
    code: not_found
    description: session not found
  - status: 500
    code: internal
    description: server error
