id: ai-blueprint-save
description: Create or update a blueprint — a frontend resource written to <project>/.agents/blueprints/<id>/; the AI creates blueprints through this interface (there is no other way, and no discovery). A blueprint is one html entry ("index.html") plus whatever files it needs beside it

request:
  body:
    id?: string  # present = write into that blueprint (a directory name), absent = create a new one (id = a slug derived from name)
    name: string  # blueprint display name; for a new blueprint it decides the directory slug
    files:
      - path: string  # relative path inside the blueprint directory (must include "index.html"; no absolute paths, no "..")
        content: string  # the file's text

response:
  status: 200
  body:
    blueprint:
      id: string  # the blueprint's directory name under .agents/blueprints/
      name: string  # the index.html <title>, falling back to the id
      entry: string  # "index.html"
      files: [string]  # relative paths inside the directory, sorted
      createdAt: string  # RFC3339
      updatedAt: string  # RFC3339

errors:
  - status: 400
    code: bad_request
    description: name or files missing, files empty or without index.html, or a path escaping the blueprint directory
  - status: 404
    code: not_found
    description: blueprint to update does not exist
  - status: 500
    code: internal
    description: server error
