id: log-tab-off
description: Close tabs — take them out of the open list, keeping their records so they can be reopened

request:
  body:
    tabIds: [string]  # tabs to close; ids that are not open are ignored
    tabId?: string  # older callers send one id here; read as a one-element tabIds

response:
  status: 200
  body:
    openTabs: [string]  # the whole open list after the write, in display order

errors:
  - status: 400
    code: bad_request
    description: tabIds missing
  - status: 500
    code: internal
    description: server internal error
