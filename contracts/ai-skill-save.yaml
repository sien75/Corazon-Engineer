id: ai-skill-save
description: Create or update a custom skill — a file at <project>/.agents/skills/<id>/SKILL.md; the AI creates skills through this interface too. Saving a suggested candidate (its id) accepts it — the skill is written out as a file and the candidate is dropped

request:
  body:
    id?: string  # present = update that skill (a custom directory name or a suggested candidate id), absent = create a new one (id = a slug derived from name)
    name: string  # skill display name
    text: string  # the skill itself: one piece of text handed to the model on run

response:
  status: 200
  body:
    skill:
      id: string  # the custom skill's directory name under .agents/skills/
      name: string
      text: string
      source: custom  # saving always produces a custom skill
      status: active
      createdAt: string  # RFC3339
      updatedAt: string  # RFC3339

errors:
  - status: 400
    code: bad_request
    description: name or text missing or empty
  - status: 404
    code: not_found
    description: skill to update does not exist
  - status: 500
    code: internal
    description: server error
