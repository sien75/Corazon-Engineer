id: static-stream
description: Long-lived connection pushing events; schema mutation events now (mirrors static-mutation), execution events (call / test / devtime) reserved.

request:
  body:
    env: string  # runtime env name
    kinds?: string  # event kinds to subscribe (comma-separated); empty = all
    edges?: string  # edge ids to subscribe; only for kind=runtime (reserved); empty = all

response:
  status: 200
  stream: sse  # body below is the schema of each event
  body:
    seq: number  # event sequence
    env: string
    ts: string  # date-time
    kind: schema | runtime | test | devtime  # schema implemented; others reserved

    payload:
      # kind=schema: content snapshot, shape matches the type below (see static-mutation)
      op: add | update | remove
      type: atom | edge | runtime | devtime | contract | test | docs | notes
      id: string  # object path, e.g. "contracts/ai-ask.yaml"; backend-generated on add
      file: string  # written file; coincides with id for leaf files

      atom?:  # when type=atom
        name: string
        description: string
        repo?: string
        path?: string
        runtime_type: string  # native | go | browser | node | bun | jre | python | dotnet | beam | ruby | php
        runtime_version?: string
        role?: string  # service | database | cache | queue | storage | gateway | scheduler | worker | proxy
        interfaces:
          provides:
            - id: string
              channel: network | stdio | ipc
              protocol: string
              contract?: string
              extend?: object
          consumes:
            - id: string
              channel: network | stdio | ipc
              protocol: string
              contract?: string
              extend?: object

      edge?:  # when type=edge
        id: string
        from: string
        from_interface: string
        to: string
        to_interface: string
        channel: network | stdio | ipc
        protocol: string
        description: string

      runtime?:  # when type=runtime
        description: string
        endpoints:
          - id: string  # atom id
            channel: network | stdio | ipc
            protocol: string
            address?: string
            in?: string
            out?: string
        telemetry?:
          - id: string  # atom id
            backend: string
            address: string
        tests?:
          - id: string
            description: string
            atoms: [string]
            edges?: [string]
            case: string

      devtime?: string  # when type=devtime

      contract?:  # when type=contract
        id: string
        description: string
        request: object
        response: object
        error: object

      test?: string  # when type=test

      docs?: string  # when type=docs

      notes?: string  # when type=notes

      # kind=runtime | test | devtime (execution events, reserved): payload shape TBD when execution lands

errors:
  - status: 400
    code: bad_request
    description: bad request
  - status: 404
    code: not_found
    description: env not found
  - status: 500
    code: internal
    description: server error
