id: log-tab-mutation
description: Overwrite a tab's layout and name, binding any session that is now shown; the layout is stored as text and returned as-is — log does not interpret it

request:
  body:
    tabId: string  # the tab to overwrite
    title: string  # recomputed from the panes' page titles; log only stores it
    layout: object  # the pane tree; a tab always has one
    sessionIds?: [string]  # conversations shown after this write; an unbound one is bound to this tab, one bound elsewhere is refused

response:
  status: 200
  body:
    tabId: string
    title: string
    layout: object  # echoed as written
    createdAt: string
    updatedAt: string
    lastAt: string

errors:
  - status: 400
    code: bad_request
    description: layout missing, or a sessionId is already bound to another tab
  - status: 404
    code: not_found
    description: tab does not exist
  - status: 500
    code: internal
    description: server internal error
