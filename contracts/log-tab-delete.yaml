id: log-tab-delete
description: Delete a tab record and take it out of the open list; its conversations are deleted separately (log-delete / ai-delete)

request:
  body:
    tabId: string

response:
  status: 200
  body:
    tabId: string  # echoed

errors:
  - status: 400
    code: bad_request
    description: tabId missing
  - status: 404
    code: not_found
    description: tab does not exist
  - status: 500
    code: internal
    description: server internal error
