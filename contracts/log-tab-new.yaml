id: log-tab-new
description: Create an empty tab record and assign its id; what it holds is written afterwards

request: {}

response:
  status: 200
  body:
    tabId: string  # the assigned t_<hex>. The record exists but has no layout yet: a tab is created before whatever lives in it

errors:
  - status: 500
    code: internal
    description: server internal error
