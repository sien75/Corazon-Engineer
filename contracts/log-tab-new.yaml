id: log-tab-new
description: Create a tab record with its first layout, bind the sessions it shows, add it to the open list (current), and name it

request:
  body:
    title: string  # the tab's display name — its panes' page titles joined by " · "; the caller resolves it, log only stores it
    layout: object  # the pane tree; a tab always has one (there is no empty tab)
    sessionIds?: [string]  # the conversations this tab shows; each is bound to this tab, and a session already bound to another tab is refused
    open?: boolean  # default true: the new tab is also put in the open list

response:
  status: 200
  body:
    tabId: string  # the assigned t_<hex>
    title: string
    layout: object  # echoed as written
    createdAt: string  # first write time, RFC3339
    updatedAt: string  # layout's write time, RFC3339
    lastAt: string  # last activity (layout write or a message in one of its sessions), RFC3339

errors:
  - status: 400
    code: bad_request
    description: layout missing, or a sessionId is already bound to another tab (the message names that tab)
  - status: 500
    code: internal
    description: server internal error
