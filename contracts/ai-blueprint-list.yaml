id: ai-blueprint-list
description: List blueprints owned by the ai service — a blueprint is a frontend resource, a directory under .agents/blueprints/ with an index.html entry and any assets beside it; there is no discovery and no sqlite, the directory listing is the whole truth

request: {}

response:
  status: 200
  body:
    blueprints:  # newest updated first
      - id: string  # the blueprint's directory name under .agents/blueprints/
        name: string  # the index.html <title>, falling back to the id
        entry: string  # the html entry file, always "index.html"
        files: [string]  # relative paths inside the directory, sorted
        createdAt: string  # RFC3339
        updatedAt: string  # RFC3339

errors:
  - status: 500
    code: internal
    description: server error
