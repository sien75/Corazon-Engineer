id: ai-skill-ignore
description: Ignore or restore a suggested skill; ignored skills are kept for de-duplication but never surfaced again

request:
  body:
    id: string  # skill id
    ignored?: boolean  # true (default) = ignore, false = restore to active

response:
  status: 200
  body:
    skill:
      id: string
      name: string
      text: string
      source: custom | suggested
      status: active | ignored
      createdAt: string  # RFC3339
      updatedAt: string  # RFC3339

errors:
  - status: 400
    code: bad_request
    description: id missing
  - status: 404
    code: not_found
    description: skill does not exist
  - status: 500
    code: internal
    description: server error
