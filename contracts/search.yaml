id: search
description: Search schema content (atom / edge / runtime / test / contract / interface path / table / topic)

request:
  body:
    q: string  # search query

response:
  status: 200
  body:
    q: string
    results:
      - type: atom | edge | runtime | devtime | contract | test | docs | notes  # hit object type
        file: string  # relative path under the type's folder, e.g. "contracts/ai-ask.yaml" / "atoms/payment/api.yaml"
        lines: [number, number]  # matched line range [start, end], 1-based
        snippet: string  # matched snippet

errors:
  - status: 400
    code: bad_request
    description: bad request
  - status: 404
    code: not_found
    description: not found
  - status: 500
    code: internal
    description: server error
