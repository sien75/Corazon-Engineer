runtime:
  dev:
    description: Playground dev environment
    atoms:
      demo-service:
        connect:
          channel: network
          address: http://localhost:9000
      demo-worker:
        connect:
          channel: stdio
          in: /tmp/playground.worker.in
          out: /tmp/playground.worker.out
    tests:
      - id: playground-api
        description: playground API tests
        atoms: [demo-service]
        case: ./tests/playground-api.md
