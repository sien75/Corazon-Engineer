atoms:
  - name: web
    description: Corazon Engineer web shell — one conversation — main, which is global and belongs to no project — plus the open sessions on screen. The titlebar is grouped by project, Chrome-style — one chip per project on the board carrying the project's name, expanding to that project's tabs followed by a `+` — a button, not a tab, that makes a new tab of that group (a browser's `+`); a tab there is either an open session or a draft — a tab with no session behind it, showing the project's home (blueprints + recents above an empty conversation) or a blueprint's page, which becomes that session's tab when its first message creates the session, so looking at a page writes nothing; a group survives its last closed tab. Hiding a group (the eye in the Engineer launcher) keeps it on the board and keeps its sessions open — it only stops drawing them. main is global and sits outside every group. The + button opens the Engineer launcher — the board of projects, where a folder is added, removed, hidden or opened — and a project opens its own launcher (that project's blueprints and recents); both are routes, so a reload comes back to the same page. A project is a folder added from that page, not the folder the program was started in — this service is also where a folder is admitted (POST /project/add checks for engineer.yaml and hands it to log), because it is the service that reads the disk. every session is one view — main and a blueprint agent whose page is an iframe onto its own /agent/<sessionId>/, and the shell draws them with the <engineer-chat> custom element under components/ (one implementation, shadow DOM, /components/chat.css) or that iframe. There is no tab record — a tab is one open session or a draft, so the workspace (which sessions are open, in display order, and which one is main) is read from log's current row, the shell resumes each open session before drawing it, and drafts live only in the window that made them; main's workspace tools open, close, create and delete sessions, and their tool frames make the shell re-read the workspace. Routes are / for main, /new for the Engineer launcher, /project/<projectId>/new for a new tab of a project, /project/<projectId>/blueprint/<slug> for one browsing a blueprint, and /session/<id> for a session, so a reload and history land back on the same page. The file server (workspace/web/server) serves /config.js (an ES module whose ENGINEER export holds the static / ai / log addresses) and the app assets from --assets, /agent/<sessionId>/ from the blueprint of the session (session → project and blueprint through log), and /agent/p/<projectId>/<slug>/ from the same directory with no session behind it — that is the page a draft browses, which is why a page can be read before anything is written; a slug that is not there is no page, and anything else from the blueprint tree under the project's folder — so one page is shared by every agent made from it; a project's `+` makes a draft on that project's home page — its blueprints (static-query) and recents above one `<engineer-chat>`, with no session and no request until the user sends the first message (that POST /ai/new is what creates the conversation — no blueprint, so its tab shows the shell's element rather than a page in a frame); a blueprint picked there opens in the same tab, still with no session, until the page's own chat sends its first message. POST /project/add is the one door a folder comes in by. It owns the page theme — /theme.css is the palette both the shell and blueprints link, and the shell writes the current data-theme into a page's document
    path: ./workspace/web
    runtime_type: browser
    role: service

