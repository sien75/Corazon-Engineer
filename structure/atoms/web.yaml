atoms:
  - name: web
    description: "Corazon Engineer web shell — one conversation and a theme switch, nothing else. It draws a single conversation with the <engineer-chat> custom element under components/ (one implementation, shadow DOM, /components/chat.css) and answers every other page URL with that same conversation; there is no tab, no project group, no launcher, no blueprint page and no iframe onto a page. Which session that conversation is comes from storage: the shell reads the most recently active session (log-session/list, page 1, first entry) and resumes it, and when there is none it starts one with /ai/new — the shell is the one that names the folder the agent works in (the folder the program was started in, resolved from --assets' checkout) and the text appended to its system prompt. A prompt goes to /ai/ask and the reply is followed on /ai/stream; a run in flight is aborted with /ai/stop, and a reload replays the session's messages (log-session/messages) before reattaching. ai owns the models; the shell never names one. It also serves /config.js (an ES module whose ENGINEER export holds the storage / ai addresses) and the app assets from --assets, and /theme.css is the palette the shell links, with the current data-theme written into the document — a theme switch is the one setting the shell keeps, and it is kept in the browser, not in storage."
    path: ./workspace/web
    runtime_type: browser
    role: service

    interfaces:
      # provides nothing: every endpoint this service answers is a page URL, loaded
      # by a browser (assets, /blobs/<sha256> in a rendered image), never called by
      # an agent or another atom
      provides: []
      consumes:
        - id: log-session-list
          channel: network
          protocol: http
          contract: ./contracts/log-session-list.yaml
          extend:
            path: /log/session/list
            method: POST
        - id: log-session-detail
          channel: network
          protocol: http
          contract: ./contracts/log-session-detail.yaml
          extend:
            path: /log/session/detail
            method: POST
        - id: log-session-messages
          channel: network
          protocol: http
          contract: ./contracts/log-session-messages.yaml
          extend:
            path: /log/session/messages
            method: POST
        - id: ai-new
          channel: network
          protocol: http
          contract: ./contracts/ai-new.yaml
          extend:
            path: /ai/new
            method: POST
        - id: ai-ask
          channel: network
          protocol: http
          contract: ./contracts/ai-ask.yaml
          extend:
            path: /ai/ask
            method: POST
        - id: ai-stream
          channel: network
          protocol: http
          contract: ./contracts/ai-stream.yaml
          extend:
            path: /ai/stream
            method: POST
        - id: ai-stop
          channel: network
          protocol: http
          contract: ./contracts/ai-stop.yaml
          extend:
            path: /ai/stop
            method: POST
        - id: ai-resume
          channel: network
          protocol: http
          contract: ./contracts/ai-resume.yaml
          extend:
            path: /ai/resume
            method: POST
        - id: ai-blobs
          channel: network
          protocol: http
          contract: ./contracts/ai-blobs.yaml
          extend:
            path: /blobs/{sha256}
            method: GET