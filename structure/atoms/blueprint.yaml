atoms:
  - name: blueprint
    description: "Corazon Engineer blueprint runtime — one service, one process, and blueprints as its only job. Blueprints live in **projects**: a project is one blueprints folder, imported once in the web UI and remembered in <home>/config.yaml together with which one is in front. Several projects coexist; each keeps running — its prod blueprints loaded, their schema applied and their init scripts started — whether or not it is in front, and switching the front starts and stops nothing. Removing a project stops it and leaves its folder and its databases alone. URLs carry the project, /bp/<project>/<slug> and /bp-dev/<project>/<slug>, because a slug is only unique inside its folder and an open page must keep pointing at its own project. A blueprint is one HTML file that carries its own tables (<script type=\"blueprint/sql\">), its own orchestration (<script type=\"blueprint/flow\">, a GitHub-Actions-shaped stack), its own backend scripts (<script type=\"blueprint/sh|js|py\" id=\"…\">) and, at most one, an init script (<script type=\"blueprint/init.js\">) — the only script allowed to put events on the bus, by writing one JSON {emit, data} per stdout line, which is how a blueprint listens to something without a page open. The browser skips every blueprint/* block; this service strips them before serving the page, so backend code and schema never reach the browser. Each blueprint gets one sqlite per mode and per project at <home>/projects/<project>/blueprints/<id>.prod.sqlite or <id>.dev.sqlite, filed under the id in its <meta id>: two projects may hold a blueprint with the same id and never share a row, and deleting a file and putting it back keeps its data. Using and developing are separate: prod is /bp/<project>/<slug> and is loaded when the project is imported, page or no page; dev is /bp-dev/<project>/<slug>, loaded only when its page is first opened, against the dev database. Nothing reloads on a file change: the page has one reload button (prod) / restart button (dev), which kills the init script, re-parses the file and starts it over. Every write goes through this service (a flow's sql step, or the page's bp.sql), which is how it knows a table changed and can push the watch. A flow's steps run in order with each step's output as the next one's input, one of run / sql / emit each; a script of any language is one JSON in on stdin (and BP_INPUT) and one JSON out on stdout, non-zero exit for failure, stderr lines pushed as log events while it runs; js blocks run through bun with a default export, and every script works in the project's blueprints folder and is handed BP_AI (the ai service's address) — a blueprint keeps a conversation by storing its session id in its own table and calling ai itself, so there is no ai step. The page gets one SSE stream (events, decoded by an embedded bp.js with bp.emit / bp.on / bp.watch / bp.sql / bp.reload) and one POST route for its ops. /bp lists the front project's blueprints. A page is told no address and no path: its channel script is `window.bp` (emit / on / watch / sql / reload / mode) and nothing else. A blueprint that wants an agent writes one `<script type=\"blueprint/ai\">` node — its text is the system prompt — and this service keeps the conversation for it: it raises the session through ai (the node's text, then where things are, and the folder the user associated with the blueprint, kept in the data home's config.yaml and asked for by the shell the first time the blueprint is opened), asks and follows the run, reads the records back from storage, and hands the page all of it as events on the bus; the session id lives in the blueprint's own sqlite. This service reads no spec file and serves no pictures. The shell page itself is the web service's."

    path: ./workspace/blueprint
    runtime_type: go
    runtime_version: "1.25"
    role: service

    interfaces:
      # Browser-facing routes, not agent-facing ones: a page loads them, an agent or
      # another atom never calls them. They are listed because their shapes are
      # contracts — blueprint-op is the page↔runtime protocol — not because anything
      # should call them.
      provides:
        - id: blueprint-page
          channel: network
          protocol: http
          contract: ./contracts/blueprint-page.yaml
          extend:
            path: /bp/{project}/{slug}
            method: GET
        - id: blueprint-events
          channel: network
          protocol: http
          contract: ./contracts/blueprint-events.yaml
          extend:
            path: /bp/{project}/{slug}/events
            method: GET
        - id: blueprint-op
          channel: network
          protocol: http
          contract: ./contracts/blueprint-op.yaml
          extend:
            path: /bp/{project}/{slug}/op
            method: POST
        - id: blueprint-projects
          channel: network
          protocol: http
          contract: ./contracts/blueprint-projects.yaml
          extend:
            path: /config/projects
            method: GET
        - id: blueprint-projects-add
          channel: network
          protocol: http
          contract: ./contracts/blueprint-projects-add.yaml
          extend:
            path: /config/projects
            method: POST
        - id: blueprint-projects-foreground
          channel: network
          protocol: http
          contract: ./contracts/blueprint-projects-foreground.yaml
          extend:
            path: /config/projects/foreground
            method: POST
        - id: blueprint-projects-remove
          channel: network
          protocol: http
          contract: ./contracts/blueprint-projects-remove.yaml
          extend:
            path: /config/projects
            method: DELETE
        - id: blueprint-list
          channel: network
          protocol: http
          contract: ./contracts/blueprint-list.yaml
          extend:
            path: /config/blueprints
            method: GET
        - id: blueprint-folder
          channel: network
          protocol: http
          contract: ./contracts/blueprint-folder.yaml
          extend:
            path: /config/blueprints/folder
            method: POST
        - id: blueprint-ai
          channel: network
          protocol: http
          contract: ./contracts/blueprint-ai.yaml
          extend:
            path: /bp/{project}/{slug}/events
            method: GET
      consumes:
        - id: log-session-list
          channel: network
          protocol: http
          contract: ./contracts/log-session-list.yaml
          extend:
            path: /log/session/list
            method: POST
        - id: log-session-detail
          channel: network
          protocol: http
          contract: ./contracts/log-session-detail.yaml
          extend:
            path: /log/session/detail
            method: POST
        - id: log-session-messages
          channel: network
          protocol: http
          contract: ./contracts/log-session-messages.yaml
          extend:
            path: /log/session/messages
            method: POST
        - id: ai-new
          channel: network
          protocol: http
          contract: ./contracts/ai-new.yaml
          extend:
            path: /ai/new
            method: POST
        - id: ai-ask
          channel: network
          protocol: http
          contract: ./contracts/ai-ask.yaml
          extend:
            path: /ai/ask
            method: POST
        - id: ai-stream
          channel: network
          protocol: http
          contract: ./contracts/ai-stream.yaml
          extend:
            path: /ai/stream
            method: POST
        - id: ai-stop
          channel: network
          protocol: http
          contract: ./contracts/ai-stop.yaml
          extend:
            path: /ai/stop
            method: POST
        - id: ai-resume
          channel: network
          protocol: http
          contract: ./contracts/ai-resume.yaml
          extend:
            path: /ai/resume
            method: POST
        - id: ai-blobs
          channel: network
          protocol: http
          contract: ./contracts/ai-blobs.yaml
          extend:
            path: /blobs/{sha256}
            method: GET