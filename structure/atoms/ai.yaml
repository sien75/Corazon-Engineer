atoms:
  - name: ai
    description: "Corazon Engineer ai service — pi-SDK-driven conversation, nothing more: a session is one conversation, one question and one answer at a time, and its id is the only thing that distinguishes it. ai has no notion of a project, a blueprint, a role (main / sub) or a tab: /ai/new is handed the folder the agent works in (cwd, absolute), the text to append to its system prompt (system) and an optional initial title, and it stores those on the session row in storage so a resumed session comes back to the same place; it never resolves a folder, reads a page, or picks a spec. Which model a session runs is decided in three layers, per slot — the session's own row in storage (what the `model` tool switched it to, or what it was created with), then the engineer home's models.yaml (one `chat` and one `image` slot, no roles), then pi's own default for chat only (the provider/model pi's settings name when pi can serve it, else the first model it can serve; the image slot stops at models.yaml); pi stays the source of the catalog, models.json and the credentials (auth.json / env), and a session never writes back to pi's settings; a model choice lives on the session row alone, and the thinking level is not stored anywhere per session, pi derives it per model from its own settings. Every session gets the same custom tools: ask_user (ask and end the turn), model (list the chat models pi can use right now and switch this session's chat or image model by slot — a chat switch is a pi setModel on the live session, which overrides the configured default for that session only; an image switch only records the choice and is what the `image` tool reads at call time; either switch is written to the session row), usage (read-only report of this conversation's context usage and cost, from pi's own getContextUsage / getSessionStats) and compact (manual compaction — scheduled on the session's turn tail rather than called inline, because pi's compact() aborts and waits for idle and would otherwise wait on the very turn that asked for it; pi's compaction_end event then persists the summary like any other entry) and web_search (live web search behind one pluggable provider — DeepSeek's /v1/tools/search first, chosen by the `provider` argument, default deepseek; the key is the one pi already holds for that provider in auth.json or that provider's own env var and never passes through the model, so a search with no key fails and says why instead of returning nothing; results are a markdown list of title, URL, site, date, authority and abstract) and image (generate a picture with this conversation's image model — the resolved `image` slot, never an argument — and show it in the conversation — one OpenAI-compatible request, POST {baseUrl}/images/generations {model, prompt, n, size}; an optional `reference` (a file path, /blobs/<sha256>, or a bare hash) turns it into an edit: POST {baseUrl}/images/edits as multipart with image / image[], the pictures copied into the blob store so storage keeps what was sent; falling back to chat-completions with modalities image+text only when the gateway answers 404/405; baseUrl, credential and headers come from pi's own provider config and auth.json, so the key never passes through the model; a model whose sizes are narrower than the OpenAI default is a per-model entry, and the response may be base64 or a url (both decoded); the bytes land in the same content-addressed uploads store a pasted image lands in, so a page draws it with /blobs/<sha256>; what the model reads back is text plus a file path — the pixels ride in the tool result's details, never as a content block, because OpenAI's tool message is text-only and a replayed image would be paid for as context every turn). On the first user turn of a session ai summarizes it (user prompts plus assistant prose only — tool traffic and thinking are left out) with the session's own model and writes the result back as the display name, unless the caller already named it. Nothing about the caller's world reaches the agent from ai itself: an agent that should know where it is, what it is for, or which interfaces exist is told so in the `system` text the caller passes in — ai injects no role spec, no interface docs and no runtime endpoints. --home is this service's own data (uploaded images), not a project."
    path: ./workspace/ai
    runtime_type: bun
    runtime_version: "1.3"
    role: service

    interfaces:
      provides:
        - id: ai-new
          channel: network
          protocol: http
          contract: ./contracts/ai-new.yaml
          extend:
            path: /ai/new
            method: POST
        - id: ai-ask
          channel: network
          protocol: http
          contract: ./contracts/ai-ask.yaml
          extend:
            path: /ai/ask
            method: POST
        - id: ai-stream
          channel: network
          protocol: http
          contract: ./contracts/ai-stream.yaml
          extend:
            path: /ai/stream
            method: POST
        - id: ai-stop
          channel: network
          protocol: http
          contract: ./contracts/ai-stop.yaml
          extend:
            path: /ai/stop
            method: POST
        - id: ai-delete
          channel: network
          protocol: http
          contract: ./contracts/ai-delete.yaml
          extend:
            path: /ai/delete
            method: POST
        - id: ai-resume
          channel: network
          protocol: http
          contract: ./contracts/ai-resume.yaml
          extend:
            path: /ai/resume
            method: POST
        - id: ai-blobs
          channel: network
          protocol: http
          contract: ./contracts/ai-blobs.yaml
          extend:
            path: /blobs/{sha256}
            method: GET

      consumes:
        - id: log-session-record-add
          channel: network
          protocol: http
          contract: ./contracts/log-session-record-add.yaml
          extend:
            path: /log/session/record/add
            method: POST
        - id: log-session-messages
          channel: network
          protocol: http
          contract: ./contracts/log-session-messages.yaml
          extend:
            path: /log/session/messages
            method: POST
        - id: log-session-delete
          channel: network
          protocol: http
          contract: ./contracts/log-session-delete.yaml
          extend:
            path: /log/session/delete
            method: POST
        - id: log-session-upsert
          channel: network
          protocol: http
          contract: ./contracts/log-session-upsert.yaml
          extend:
            path: /log/session/upsert
            method: POST
        - id: log-session-detail
          channel: network
          protocol: http
          contract: ./contracts/log-session-detail.yaml
          extend:
            path: /log/session/detail
            method: POST