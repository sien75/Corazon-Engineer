atoms:
  - name: storage
    description: "Corazon Engineer storage service — one service, one process, one home. It owns the engineer home's sqlite state and the read-only views of a project folder's file tree. Two tables only: records (the messages of every conversation) and sessions (each conversation's folder — the absolute path its agent works in, and the cwd of a resumed session — the text appended to its system prompt, its display name and the chat and image models it runs, \"\" meaning the models.yaml default applies; there is no role, no project, no blueprint and no open / main position, so a session is a plain conversation and its id is the only thing that says which). It knows nothing about projects: a folder is not a row anywhere, and the /static/* endpoints take the folder's absolute path in the request. One service answering two prefixes — /log/* for the records and sessions, /static/* for a folder's files — because each path names the thing it acts on. The static side reads atoms, edges, contracts and the prose beside them — how-to, development, docs, humanwrite, and the dot-directory resources skills (.agents/skills) and blueprints (.agents/blueprints) — covering every file type, without validating the tree (a malformed atom or a dangling edge is not its business; writes go through the ai shell), and rejects path escapes outside the tree it was given. Its two static streams are fed by a one-second poll of the folder each request named."
    path: ./workspace/storage
    runtime_type: go
    runtime_version: "1.22"
    role: service

    interfaces:
      provides:
        - id: log-session-list
          channel: network
          protocol: http
          contract: ./contracts/log-session-list.yaml
          extend:
            path: /log/session/list
            method: POST
        - id: log-session-detail
          channel: network
          protocol: http
          contract: ./contracts/log-session-detail.yaml
          extend:
            path: /log/session/detail
            method: POST
        - id: log-session-messages
          channel: network
          protocol: http
          contract: ./contracts/log-session-messages.yaml
          extend:
            path: /log/session/messages
            method: POST
        - id: log-session-upsert
          channel: network
          protocol: http
          contract: ./contracts/log-session-upsert.yaml
          extend:
            path: /log/session/upsert
            method: POST
        - id: log-session-delete
          channel: network
          protocol: http
          contract: ./contracts/log-session-delete.yaml
          extend:
            path: /log/session/delete
            method: POST
        - id: log-session-record-add
          channel: network
          protocol: http
          contract: ./contracts/log-session-record-add.yaml
          extend:
            path: /log/session/record/add
            method: POST
        - id: static-query
          channel: network
          protocol: http
          contract: ./contracts/static-query.yaml
          extend:
            path: /static/query
            method: POST
        - id: static-query-detail
          channel: network
          protocol: http
          contract: ./contracts/static-query-detail.yaml
          extend:
            path: /static/query-detail
            method: POST
        - id: static-stream
          channel: network
          protocol: http
          contract: ./contracts/static-stream.yaml
          extend:
            path: /static/stream
            method: POST
      consumes: []