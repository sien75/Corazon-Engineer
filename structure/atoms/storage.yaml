atoms:
  - name: storage
    description: "Corazon Engineer storage service — one service, one process, one home. It owns the engineer home's sqlite state — records (call / observe / conversation), projects (the board of folders the program works on — path, name, whether it is still on the board (removal is soft) and whether its group is drawn in the titlebar (hiding is not removal)), sessions (each conversation's kind, main or sub, the project it belongs to, the blueprint it drives, its display name and the chat and image models it runs — \"\" meaning the role default in the engineer home's models.yaml applies) and current (which sessions are open — the shell's tab bar — and which one is main); a tab is not stored — it is one open session, so the open list is all the workspace needs; the home is the program's own data directory, not a project — the program runs anywhere and the folders it serves are rows in projects — and it serves the read-only views of those projects' file trees: query / query-detail / stream over atoms, edges, contracts and the prose beside them — how-to, development, docs, humanwrite, and the dot-directory resources skills (.agents/skills) and blueprints (.agents/blueprints) — covering every file type, without validating the tree (a malformed atom or a dangling edge is not its business; writes go through the ai shell). The routes keep the two prefixes the two halves had as separate services — /log/* for the records, /static/* for a project's files — because each path names the thing it acts on. Being one process is what removes the cross-service call that used to resolve a request's projectId to a folder: the project board is a table here, so a /static/* request reads it with a query instead of calling /log/project/get over HTTP and caching the answer. It exposes log query/detail/search/mutation/stream/list/delete APIs, a workspace stream that pushes an event after every change to sessions or projects plus the session, project and current ones, and the static query/detail/stream ones whose stream is fed by a one-second poll of every project's file tree."
    path: ./workspace/storage
    runtime_type: go
    runtime_version: "1.22"
    role: service

