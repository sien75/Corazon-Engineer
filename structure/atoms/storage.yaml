atoms:
  - name: storage
    description: "Corazon Engineer storage service — one service, one process, one home. It owns the engineer home's sqlite state: records (the messages of every conversation) and sessions (each conversation's folder — the absolute path its agent works in, and the cwd of a resumed session — the text appended to its system prompt, its display name and the chat and image models it runs, \"\" meaning the models.yaml default applies; there is no role, no project, no blueprint and no open / main position, so a session is a plain conversation and its id is the only thing that says which). One prefix, /log/*, because that is the only kind of thing this service answers now: the read-only views of a folder's file tree (/static/*) and the streams beside them are parked in static_bak/ at the checkout root, together with their contracts and docs — nothing registers them."
    path: ./workspace/storage
    runtime_type: go
    runtime_version: "1.22"
    role: service

    interfaces:
      provides:
        - id: log-session-list
          channel: network
          protocol: http
          contract: ./contracts/log-session-list.yaml
          extend:
            path: /log/session/list
            method: POST
        - id: log-session-detail
          channel: network
          protocol: http
          contract: ./contracts/log-session-detail.yaml
          extend:
            path: /log/session/detail
            method: POST
        - id: log-session-messages
          channel: network
          protocol: http
          contract: ./contracts/log-session-messages.yaml
          extend:
            path: /log/session/messages
            method: POST
        - id: log-session-upsert
          channel: network
          protocol: http
          contract: ./contracts/log-session-upsert.yaml
          extend:
            path: /log/session/upsert
            method: POST
        - id: log-session-delete
          channel: network
          protocol: http
          contract: ./contracts/log-session-delete.yaml
          extend:
            path: /log/session/delete
            method: POST
        - id: log-session-record-add
          channel: network
          protocol: http
          contract: ./contracts/log-session-record-add.yaml
          extend:
            path: /log/session/record/add
            method: POST
      consumes: []