id: log-session-list
description: List conversation sessions (POST /log/session/list), most recently active first — one entry per session, including one that has not been asked anything yet (count 0); a client that keeps a single conversation reads the first entry

request:
  body:
    pageNum?: number  # page number, 1-based, default 1

response:
  status: 200
  body:
    sessions:
      - sessionId: string  # conversation session id
        cwd: string  # absolute folder the agent works in, "" when none was ever written
        title: string  # display name: the initial title, or the title ai summarized from the conversation; "" when none was written
        model: string  # provider/model-id of the chat model this session runs, "" when the models.yaml default applies
        imageModel: string  # provider/model-id of the image-generation model, "" when the models.yaml default applies or none is set
        createdAt: string  # first message time, or the session row's creation time when nothing was said yet, RFC3339
        lastAt: string  # latest message time, or createdAt when nothing was said yet, RFC3339
        count: number  # number of messages in the session
        preview: string  # first user message content snippet
    pageNum: number  # echoed page number
    hasMore: boolean  # whether more pages exist
    pageSize: 100  # fixed page size, 100 sessions per page

errors:
  - status: 400
    code: bad_request
    description: bad request
  - status: 500
    code: internal
    description: server error