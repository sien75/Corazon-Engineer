id: ai-new
description: Start a conversation session — the caller names the folder the agent works in, the text to append to its system prompt and an optional initial title; ai knows nothing else about what the conversation is for

request:
  body:
    cwd: string  # absolute folder path the agent works in, resolved by the caller; stored on the session row so a resumed session comes back to the same place. A relative path is refused
    system?: string  # text appended to the end of this session's system prompt — whatever the caller wants the agent to know (a page's README, a role spec, interface docs). ai does not read it, only carries it, and stores it on the session row for resume
    title?: string  # display name of the session; "" falls back to "chat", replaced later by the title ai summarizes from the first turn
    chat?: string  # provider/model-id of the chat model this session runs; omitted means the `chat` in the engineer home's models.yaml. Recorded on the session row, and a `model` tool switch with slot=chat overrides it from then on (persisted too, so it survives a restart)
    image?: string  # provider/model-id of the image-generation model; omitted means the `image` in models.yaml. Recorded on the session row, and a `model` tool switch with slot=image overrides it later

response:
  status: 200
  body:
    sessionId: string  # the new session; the caller owns what it means and when to put it on screen
    chat: string  # the chat model named for this session, "" when the models.yaml default applies
    image: string  # the image-generation model named for this session, "" when the models.yaml default applies

errors:
  - status: 400
    code: bad_request
    description: cwd missing or not an absolute path; chat naming one pi cannot use right now, or image not shaped provider/model-id
  - status: 500
    code: internal
    description: server error