id: log-mutation
description: Write a record (ai only); op is add for now

request:
  body:
    op: add  # only add for now
    kind: test | telemetry | conversation
    env?: string  # runtime env
    atom?: string  # related atom
    sessionId?: string  # kind=conversation
    payload: object  # kind-specific content
      # kind=test:       case, atoms, req, resp, result — triggered by a runtime test
      # kind=telemetry:  signal (trace | metric | log), query, result — listening per runtime telemetry
      # kind=conversation: seq, role, content, raw
      #   role: user | assistant | toolResult | compaction
      #   content: derived plain-text projection (session list preview / search)
      #   raw: the pi message (or compaction entry) verbatim; the source of truth.
      #        Image bytes are stored as content-addressed refs
      #        { type: image, sha256, mimeType, size } and re-inlined on read.

response:
  status: 200
  body:
    id: string  # assigned record id
    createdAt: string  # record creation time, RFC3339

errors:
  - status: 400
    code: bad_request
    description: bad request
  - status: 500
    code: internal
    description: server error
