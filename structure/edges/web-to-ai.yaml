edges:
  - id: web-to-ai
    from: web
    from_interface: ai-new
    to: ai
    to_interface: ai-new
    channel: network
    protocol: http
    description: the shell starts the conversation it draws, naming the folder the agent works in and the system text to append
  - id: web-to-ai-ask
    from: web
    from_interface: ai-ask
    to: ai
    to_interface: ai-ask
    channel: network
    protocol: http
    description: web sends a prompt to ai; ai orchestrates the operation (reply streams back)
  - id: web-to-ai-stream
    from: web
    from_interface: ai-stream
    to: ai
    to_interface: ai-stream
    channel: network
    protocol: http
    description: web consumes the session's SSE event stream; a run ends when ai closes it on agent_settled
  - id: web-to-ai-resume
    from: web
    from_interface: ai-resume
    to: ai
    to_interface: ai-resume
    channel: network
    protocol: http
    description: web resumes the session it draws; ai rebuilds its context from storage records and its cwd / system from the session row
  - id: web-to-ai-stop
    from: web
    from_interface: ai-stop
    to: ai
    to_interface: ai-stop
    channel: network
    protocol: http
    description: web aborts the run in flight; the session stays and can be asked again
  - id: web-to-ai-blobs
    from: web
    from_interface: ai-blobs
    to: ai
    to_interface: ai-blobs
    channel: network
    protocol: http
    description: web loads an image by its content address; ai serves the stored bytes
