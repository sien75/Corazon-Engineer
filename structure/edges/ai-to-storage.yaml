edges:
  - id: ai-to-storage-write
    from: ai
    from_interface: log-session-record-add
    to: storage
    to_interface: log-session-record-add
    channel: network
    protocol: http
    description: ai appends each message of a conversation to storage as it happens
  - id: ai-to-storage-session-messages
    from: ai
    from_interface: log-session-messages
    to: storage
    to_interface: log-session-messages
    channel: network
    protocol: http
    description: ai reads a session's conversation messages to rebuild context on resume
  - id: ai-to-storage-session-delete
    from: ai
    from_interface: log-session-delete
    to: storage
    to_interface: log-session-delete
    channel: network
    protocol: http
    description: ai-delete removes a conversation's records and its session row
  - id: ai-to-storage-session-upsert
    from: ai
    from_interface: log-session-upsert
    to: storage
    to_interface: log-session-upsert
    channel: network
    protocol: http
    description: ai records a session's cwd, system text, display name and the chat / image models it runs
  - id: ai-to-storage-session-detail
    from: ai
    from_interface: log-session-detail
    to: storage
    to_interface: log-session-detail
    channel: network
    protocol: http
    description: resume reads a session's cwd and system text to rebuild the conversation it describes
