<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hello</title>
  <!-- Bootstrap: the page sets the theme itself before first paint, reading the
       same key the shell shares; the shell pushes later changes. Only job here is
       that the first paint is already right, with no light flash. -->
  <script>
    document.documentElement.setAttribute(
      "data-theme", localStorage.getItem("engineer.theme") || "light");
  </script>
  <!-- The shell's palette. Linking it is all a blueprint needs to follow the
       theme: the variables resolve, and the shell writes data-theme into this
       document when it loads and whenever the user switches (see docs/ai.md). -->
  <link rel="stylesheet" href="/theme.css">
  <style>
    /* This is a document of its own — its own :root and body are fine. */
    body { margin: 0; padding: 24px; font-size: 13px; line-height: 1.6; } /* family comes from /theme.css */
    h1 { font-size: 15px; margin: 0 0 12px; }
    dt { color: var(--fg-muted); }
    dd { margin: 0 0 6px; }
    /* A swatch that proves the shared palette is live: it must repaint when the
       shell's theme changes, without this page reloading. */
    #swatch { display: inline-block; width: 60px; height: 12px; vertical-align: -2px;
              border: 1px solid var(--border-strong); background: var(--surface-3); }
    #err { color: var(--err); }
  </style>
</head>
<body>
  <h1>Hello — this page is a blueprint</h1>
  <dl>
    <dt>served from</dt><dd id="path"></dd>
    <dt>theme</dt><dd><span id="theme">…</span> <span id="swatch"></span></dd>
    <dt>ai</dt><dd id="ai">…</dd>
    <dt>blueprints</dt><dd id="bps">…</dd>
  </dl>
  <div id="err"></div>
  <p>Everything here is the page talking to the services the same way the shell
  does — same origin for <code>/config.js</code> and <code>/theme.css</code>,
  cross-origin (CORS) for the api. Delete this directory if you don't want it.</p>
  <script type="module">
    // /config.js is an ES module; importing it is how a page gets the addresses.
    import { ENGINEER } from "/config.js";

    document.getElementById("path").textContent = location.pathname;
    const showTheme = () => {
      document.getElementById("theme").textContent =
        document.documentElement.getAttribute("data-theme") || "(none)";
    };
    showTheme();
    new MutationObserver(showTheme)
      .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

    document.getElementById("ai").textContent = ENGINEER.ai;
    try {
      // Blueprints are plain files; static serves the listing of them.
      const r = await fetch(ENGINEER.static + "/static/query", {
        method: "POST",
        headers: { "Content-Type": "application/yaml" },
        body: "{}",
      });
      const names = [...(await r.text()).matchAll(/\.agents\/blueprints\/([^/]+)\/index\.html/g)]
        .map((m) => m[1]);
      document.getElementById("bps").textContent =
        [...new Set(names)].join(", ") + ` (HTTP ${r.status})`;
    } catch (e) {
      document.getElementById("err").textContent = "could not reach static: " + e;
    }
  </script>
</body>
</html>
